{% set version = "3.3.0" %}

package:
  name: pendulum
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pendulum/pendulum-{{ version }}.tar.gz
  sha256: 9aceb5b24e9f55381df08187397e88546b5ba82f698b741cbf1a05c5e2369116

build:
  number: 0
  skip: true  # [py<310]
  script:
    - {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation
  missing_dso_whitelist:
    - lib/libgcc_s.so.1  # [linux]

requirements:
  build:
    # Do not use stdlib('c') on Windows, as it clashes with the current rust 1.89.0.
    - {{ stdlib('c') }}  # [not win]
    - {{ compiler('rust') }}
  host:
    - python
    - pip
    - maturin >=1.0,<2.0
    - poetry-core
  run:
    - python
    - python-dateutil >=2.6
    - python-tzdata >=2020.1
    - tzdata >=2020.1

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - pendulum

about:
  home: https://pendulum.eustace.io
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python datetimes made easy
  description: |
    Drop-in replacement for the standard datetime class.
    It behaves exactly like it but with many improvements.
  doc_url: https://pendulum.eustace.io/docs/
  dev_url: https://github.com/sdispater/pendulum

extra:
  recipe-maintainers:
    - mcs07
    - ocefpaf
    - xylar
